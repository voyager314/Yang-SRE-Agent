[project]
name = "sre-agent"
version = "0.1.0"
description = "AI-powered SRE agent for infrastructure diagnostics"
readme = "README.md"
authors = [
    { name = "voyger314", email = "1429796980@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.89.0,<2.0",
    "typer>=0.12.0,<1.0",
    "rich>=13.0.0,<14.0",
    "pydantic-settings>=2.0.0,<3.0",
    "jinja2>=3.1.0,<4.0",
    "httpx>=0.27.0,<1.0",
    "pyyaml>=6.0,<7.0",
    "prompt-toolkit>=3.0.0,<4.0",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0,<4.0",
]

[project.scripts]
sre-agent = "sre_agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_agent"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["litellm.*", "prompt_toolkit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5.0", "mypy>=1.10"]
