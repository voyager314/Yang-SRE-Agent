id: "upstream-rate-limit-cascade"
description: "上游 API 网关限流导致下游服务连锁超时，告警指向下游但根因在上游"
category: "cascading-failure"
difficulty: "medium"

question: "订单系统过去 15 分钟出现大量超时，多个服务同时告警，请诊断根因。"

tool_responses:

  alertmanager_list:
    - match: {}
      result:
        status: "success"
        data: |
          [CRITICAL] (2 alerts)
          ----------------------------------------
            HighLatencyP99 | ns=production | service=order-service
              P99 latency above 5s for order-service
            HighErrorRate | ns=production | service=order-service
              Error rate above 10% for order-service

          [WARNING] (3 alerts)
          ----------------------------------------
            HighLatencyP99 | ns=production | service=inventory-service
              P99 latency above 3s for inventory-service
            HighLatencyP99 | ns=production | service=payment-service
              P99 latency above 3s for payment-service
            UpstreamRateLimited | ns=production | service=api-gateway
              Rate limit threshold reached (2000 req/s)

  prometheus_query:
    - match:
        query_contains: "http_request_duration"
      result:
        status: "success"
        data: |
          {service="order-service", quantile="0.99"} => 8.2
          {service="inventory-service", quantile="0.99"} => 4.1
          {service="payment-service", quantile="0.99"} => 3.8
          {service="api-gateway", quantile="0.99"} => 0.12

    - match:
        query_contains: "error"
      result:
        status: "success"
        data: |
          {service="order-service", code="504"} => 34.5
          {service="order-service", code="429"} => 112.8
          {service="inventory-service", code="504"} => 18.2
          {service="payment-service", code="504"} => 12.7
          {service="api-gateway", code="429"} => 145.3

    - match:
        query_contains: "rate_limit"
      result:
        status: "success"
        data: |
          {service="api-gateway", policy="global"} => 2000
          {service="api-gateway", action="rejected"} => 145.3
          {service="api-gateway", action="passed"} => 1854.7

    - match:
        query_contains: "request"
      result:
        status: "success"
        data: |
          {service="api-gateway"} => 2000
          {service="order-service"} => 856
          {service="inventory-service"} => 421
          {service="payment-service"} => 318

    - match:
        query_contains: "memory"
      result:
        status: "success"
        data: |
          {container="order-service"} => 312000000
          {container="inventory-service"} => 245000000
          {container="payment-service"} => 189000000

    - match:
        query_contains: "cpu"
      result:
        status: "success"
        data: |
          {container="order-service"} => 0.45
          {container="inventory-service"} => 0.31
          {container="payment-service"} => 0.28
          {container="api-gateway"} => 0.72

    - match:
        query_contains: "up"
      result:
        status: "success"
        data: |
          {job="order-service"} => 1
          {job="inventory-service"} => 1
          {job="payment-service"} => 1
          {job="api-gateway"} => 1

  prometheus_query_range:
    - match:
        query_contains: "rate_limit"
      result:
        status: "success"
        data: |
          {service="api-gateway", action="rejected"}:
            [1723456000] 0
            [1723456300] 2.1
            [1723456600] 45.8
            [1723456900] 112.3
            [1723457200] 145.3

    - match:
        query_contains: "429"
      result:
        status: "success"
        data: |
          {service="api-gateway", code="429"}:
            [1723456000] 0
            [1723456300] 2.1
            [1723456600] 45.8
            [1723456900] 112.3
            [1723457200] 145.3
          {service="order-service", code="429"}:
            [1723456000] 0
            [1723456300] 1.8
            [1723456600] 40.2
            [1723456900] 98.5
            [1723457200] 112.8

    - match:
        query_contains: "request"
      result:
        status: "success"
        data: |
          {service="api-gateway"}:
            [1723456000] 1200
            [1723456300] 1580
            [1723456600] 1890
            [1723456900] 1980
            [1723457200] 2000

    - match:
        query_contains: "duration"
      result:
        status: "success"
        data: |
          {service="order-service", quantile="0.99"}:
            [1723456000] 0.45
            [1723456300] 1.2
            [1723456600] 3.8
            [1723456900] 6.5
            [1723457200] 8.2
          {service="api-gateway", quantile="0.99"}:
            [1723456000] 0.08
            [1723456300] 0.09
            [1723456600] 0.11
            [1723456900] 0.12
            [1723457200] 0.12

  loki_query:
    - match:
        query_contains: "order"
      result:
        status: "success"
        data: |
          [app="order-service"] 2024-08-12T10:10:02Z ERROR - upstream request failed: 429 Too Many Requests from api-gateway
          [app="order-service"] 2024-08-12T10:10:03Z ERROR - circuit breaker OPEN for api-gateway calls, rejecting requests
          [app="order-service"] 2024-08-12T10:10:05Z WARN - retry attempt 3/3 to api-gateway failed with 429
          [app="order-service"] 2024-08-12T10:10:08Z ERROR - upstream request failed: 429 Too Many Requests from api-gateway
          [app="order-service"] 2024-08-12T10:10:10Z ERROR - request timeout after 5000ms waiting for api-gateway response
          [app="order-service"] 2024-08-12T10:09:30Z WARN - retrying request to api-gateway (attempt 2/3)

    - match:
        query_contains: "gateway"
      result:
        status: "success"
        data: |
          [app="api-gateway"] 2024-08-12T10:08:15Z WARN - approaching rate limit: 1890/2000 req/s
          [app="api-gateway"] 2024-08-12T10:09:00Z WARN - rate limit exceeded: rejecting requests above 2000 req/s
          [app="api-gateway"] 2024-08-12T10:09:01Z INFO - rate limit policy: global, limit=2000, window=1s
          [app="api-gateway"] 2024-08-12T10:09:30Z WARN - sustained rate limiting: 145 req/s rejected
          [app="api-gateway"] 2024-08-12T10:10:00Z INFO - top rejected clients: order-service(45%), inventory-service(30%), payment-service(25%)

    - match:
        query_contains: "error"
      result:
        status: "success"
        data: |
          [app="order-service"] 2024-08-12T10:10:02Z ERROR - upstream request failed: 429 Too Many Requests from api-gateway
          [app="order-service"] 2024-08-12T10:10:03Z ERROR - circuit breaker OPEN for api-gateway calls
          [app="inventory-service"] 2024-08-12T10:10:04Z ERROR - failed to fetch pricing data: 429 from api-gateway
          [app="payment-service"] 2024-08-12T10:10:05Z ERROR - payment validation request rejected: 429 from api-gateway

    - match:
        query_contains: "inventory"
      result:
        status: "success"
        data: |
          [app="inventory-service"] 2024-08-12T10:10:04Z ERROR - failed to fetch pricing data: 429 from api-gateway
          [app="inventory-service"] 2024-08-12T10:10:06Z WARN - retrying pricing lookup (attempt 2/3)
          [app="inventory-service"] 2024-08-12T10:10:08Z ERROR - pricing lookup failed after 3 retries

  trace_search:
    - match:
        service: "order-service"
      result:
        status: "success"
        data: |
          TRACE ID                           SERVICE              OPERATION                 DURATION  SPANS ERRORS
          ---------------------------------- -------------------- ------------------------- ---------- ------ ------
          trace001aaaa                       order-service        POST /api/orders             8200ms     12      3
          trace002bbbb                       order-service        POST /api/orders             6500ms     10      2
          trace003cccc                       order-service        POST /api/orders              450ms      8      0

    - match: {}
      result:
        status: "success"
        data: |
          TRACE ID                           SERVICE              OPERATION                 DURATION  SPANS ERRORS
          ---------------------------------- -------------------- ------------------------- ---------- ------ ------
          trace001aaaa                       order-service        POST /api/orders             8200ms     12      3

  trace_get:
    - match:
        trace_id: "trace001aaaa"
      result:
        status: "success"
        data: |
          Trace: trace001aaaa
          Spans: 12 | Errors: 3

          └─ order-service::POST /api/orders (8200.0ms) ❌ ERROR ⚠️ SLOW
             ├─ order-service::validateOrder (50.0ms)
             ├─ api-gateway::GET /api/pricing (5000.0ms) ❌ ERROR ⚠️ SLOW [http.status_code=429]
             │  └─ (retry) api-gateway::GET /api/pricing (5000.0ms) ❌ ERROR [http.status_code=429]
             ├─ inventory-service::checkStock (120.0ms)
             ├─ api-gateway::POST /api/payment/validate (5000.0ms) ❌ ERROR ⚠️ SLOW [http.status_code=429]
             └─ order-service::saveOrder (30.0ms)

    - match:
        trace_id: "trace003cccc"
      result:
        status: "success"
        data: |
          Trace: trace003cccc
          Spans: 8 | Errors: 0

          └─ order-service::POST /api/orders (450.0ms)
             ├─ order-service::validateOrder (45.0ms)
             ├─ api-gateway::GET /api/pricing (120.0ms)
             ├─ inventory-service::checkStock (110.0ms)
             ├─ api-gateway::POST /api/payment/validate (95.0ms)
             └─ order-service::saveOrder (30.0ms)

  trace_services:
    - match: {}
      result:
        status: "success"
        data: |
          api-gateway
          inventory-service
          order-service
          payment-service
          recommendation-service
          user-service

ground_truth:
  root_cause_service: "api-gateway"
  root_cause_type: "rate-limiting"

  key_signals:
    - signal: "429 / rate limit / Too Many Requests / 限流"
      required: true
    - signal: "api-gateway 拒绝请求 145 req/s / rejected"
      required: true
    - signal: "流量增长到 2000 req/s 触发限流阈值"
      required: false
    - signal: "下游重试放大导致连锁超时"
      required: false
    - signal: "circuit breaker / 熔断"
      required: false

  wrong_conclusions:
    - "order-service 自身性能问题"
    - "inventory-service 或 payment-service 是根因"
    - "数据库连接问题"
    - "内存或 CPU 不足"
