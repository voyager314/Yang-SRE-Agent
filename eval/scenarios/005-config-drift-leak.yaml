ground_truth:
  root_cause_service: "search-service"
  root_cause_type: "config-drift-memory-leak"

  key_signals:
    - signal: "cache.ttl 从 3600 改为 -1 (infinite) / 配置变更"
      required: true
    - signal: "内存单调增长 / 泄漏 / monotonic increase"
      required: true
    - signal: "GC 停顿时间随时间增长 / Full GC pause"
      required: true
    - signal: "凌晨 2:05 配置变更时间点与问题开始时间吻合"
      required: true
    - signal: "缓存条目无限增长 / 4523 entries 1.2GB / ttl=INFINITE"
      required: false
    - signal: "log.level 改为 DEBUG 导致线程泄漏 / thread per request"
      required: false
    - signal: "值班人员说只改了日志级别但实际还改了 cache.ttl"
      required: false

  wrong_conclusions:
    - "Elasticsearch 性能问题"
    - "流量增长导致 OOM"
    - "仅日志级别变更导致问题"
    - "search-service 代码 bug 导致内存泄漏（是配置引入的）"
    - "order-service 相关"
