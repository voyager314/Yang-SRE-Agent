id: "config-drift-memory-leak"
description: "配置变更引入的慢性内存泄漏，初期无告警，积累数小时后触发连锁故障，需要关联时间线"
category: "slow-degradation"
difficulty: "hard"

question: |
  search-service 从今天凌晨 2 点开始逐渐变慢，到上午 10 点开始出现 OOM 重启。
  昨晚有一次配置变更但值班人员说"只改了日志级别"。请深入诊断。

tool_responses:

  alertmanager_list:
    - match: {}
      result:
        status: "success"
        data: |
          [CRITICAL] (1 alert)
          ----------------------------------------
            KubePodCrashLooping | ns=production | pod=search-service-5f8a2-xk7j9
              Pod is crash looping (restart count: 3)

          [WARNING] (2 alerts)
          ----------------------------------------
            HighLatencyP99 | ns=production | service=search-service
              P99 latency above 4s for search-service
            HighMemoryUsage | ns=production | pod=search-service-5f8a2-xk7j9
              Memory usage above 85% of limit

